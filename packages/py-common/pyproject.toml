[project]
name = "lct-common"
version = "0.1.0"
description = "Общая инфраструктура Python-сервисов СтройКонтроля: логи, ошибки, health, HTTP-клиент"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
db = ["sqlalchemy[asyncio]>=2.0.35", "asyncpg>=0.29"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
