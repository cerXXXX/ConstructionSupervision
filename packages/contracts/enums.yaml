# Канонические перечисления системы. Единственный источник истины.
#
# Правила (packages/contracts/README.md):
#   - добавить значение можно;
#   - удалить или переименовать — несовместимое изменение, нужен ADR и /api/v2;
#   - дублировать эти списки в коде сервисов запрещено.
#
# Значения SCREAMING_SNAKE_CASE, кроме кодов классов техники: они lower_snake_case,
# потому что совпадают с метками CV-модели и с ключами в required/allowed/signature.

object_type:        [RESIDENTIAL_MONOLITH, RESIDENTIAL_PANEL, PUBLIC_BUILDING, ROAD]
construction_phase: [PREPARATORY, SUBSTRUCTURE, SUPERSTRUCTURE, ENVELOPE_ROOF, NETWORKS, LANDSCAPING]
object_lifecycle:   [DRAFT, ACTIVE, ARCHIVED]

zone_type:          [PIT, BUILDING_FOOTPRINT, PERIMETER, ENTRY_GATE, STORAGE, DANGER, ROAD]
visibility_status:  [OK, PARTIAL, BLIND]
visibility_reason:  [NO_IMAGES, DARK, OCCLUDED, BLURRED]

equipment_role:     [REQUIRED, ALLOWED, SIGNATURE]
equipment_state:    [WORKING, IDLE, OUT_OF_ZONE, UNKNOWN]

stage_label:        [PIT, PILES, FOUNDATION, FRAME, FACADE, LANDSCAPING]
stage_source:       [POS_ENGINE, IMPORT, MANUAL]
stage_fact_status:  [NOT_STARTED, IN_PROGRESS, DONE, LATE, AHEAD]

image_status:       [NEEDS_TIME, PENDING, PROCESSING, ANALYZED, FAILED]
image_source:       [UPLOAD, API, FOLDER_IMPORT]
timestamp_source:   [EXIF, FILENAME, MANUAL, UNKNOWN]
session_status:     [OPEN, CLOSED, AGGREGATED]

deviation_code:     [D1, D2, D3, D4, D5, D6, D7, D8, D9, D10]
severity:           [INFO, LOW, MEDIUM, HIGH]
deviation_status:   [NEW, CONFIRMED, REJECTED, RESOLVED]
deviation_verdict:  [CONFIRMED, FALSE_POSITIVE]

object_status:      [ON_TRACK, DELAY, AHEAD, UNKNOWN]
confidence:         [LOW, MEDIUM, HIGH]
dependency_type:    [FS, SS, FF, SF]
analysis_trigger:   [SESSION_CLOSED, PLAN_CHANGED, RULES_CHANGED, MANUAL]

# Стартовая таксономия техники для первичного заполнения справочника
# plandb.equipment_class. Дальше классы живут в БД и правятся оператором:
# добавление класса — строка в справочнике, а не правка этого файла.
#
# prompts — текстовые запросы для open-vocabulary детектора. Английские
# работают заметно лучше русских, поэтому таксономия русская, а промпты нет.
equipment_class_seed:
  - {code: excavator,         name_ru: "Экскаватор",                    group_code: EARTHWORKS, prompts: ["excavator", "digger", "backhoe"]}
  - {code: dump_truck,        name_ru: "Самосвал",                      group_code: TRANSPORT,  prompts: ["dump truck", "tipper truck"]}
  - {code: bulldozer,         name_ru: "Бульдозер",                     group_code: EARTHWORKS, prompts: ["bulldozer", "crawler dozer"]}
  - {code: loader,            name_ru: "Погрузчик",                     group_code: EARTHWORKS, prompts: ["wheel loader", "front loader"]}
  - {code: roller,            name_ru: "Каток",                         group_code: ROAD,       prompts: ["road roller", "compactor roller"]}
  - {code: tower_crane,       name_ru: "Башенный кран",                 group_code: LIFTING,    prompts: ["tower crane"]}
  - {code: truck_crane,       name_ru: "Автокран",                      group_code: LIFTING,    prompts: ["mobile crane", "truck crane"]}
  - {code: manipulator_crane, name_ru: "Кран-манипулятор",              group_code: LIFTING,    prompts: ["knuckle boom truck", "truck mounted crane"]}
  - {code: concrete_mixer,    name_ru: "Автобетоносмеситель",           group_code: CONCRETE,   prompts: ["concrete mixer truck", "cement mixer truck"]}
  - {code: concrete_pump,     name_ru: "Автобетононасос",               group_code: CONCRETE,   prompts: ["concrete pump truck", "boom pump"]}
  - {code: pile_driver,       name_ru: "Буровая/сваебойная установка",  group_code: EARTHWORKS, prompts: ["pile driver", "drilling rig"]}
  - {code: truck,             name_ru: "Грузовик",                      group_code: TRANSPORT,  prompts: ["truck", "lorry"]}
  - {code: asphalt_paver,     name_ru: "Асфальтоукладчик",              group_code: ROAD,       prompts: ["asphalt paver", "asphalt finisher"]}
  - {code: grader,            name_ru: "Грейдер",                       group_code: ROAD,       prompts: ["motor grader"]}
  - {code: person,            name_ru: "Человек",                       group_code: OTHER,      prompts: ["person", "construction worker"]}

equipment_group:    [EARTHWORKS, LIFTING, CONCRETE, TRANSPORT, ROAD, OTHER]
