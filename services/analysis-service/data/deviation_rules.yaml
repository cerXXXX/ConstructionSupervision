# Начальные настройки правил отклонений D1–D10 (docs/methodology.md, раздел 9).
#
# При первом старте сервис переносит их в таблицу deviation_rule (T15), дальше
# источник истины — таблица: пороги и тексты правятся через API и интерфейс.
# Новый тип отклонения из готового предиката — новая запись здесь, без кода.
#
# Поля:
#   predicate        — имя функции из реестра core/predicates.py;
#   severity         — базовая серьёзность (enums.yaml: severity);
#   params           — пороги. min_sessions — сколько рабочих сессий подряд держится
#                      условие (у D1, D2, D8 его задаёт правило вехи, а не эта запись);
#                      escalate_after_days + escalate_to — повышение серьёзности, если
#                      условие держится столько рабочих дней; variants — другие
#                      формулировки того же кода: предикат выбирает вариант полем
#                      facts.template_variant;
#   title_template,
#   message_template — текст карточки. Подстановки — поля facts отклонения;
#                      после двоеточия — формат: date (ДД.ММ.ГГГГ), counts (техника
#                      с числами), groups (группы правила), list (перечень через запятую).
#
# Значения порогов — наши экспертные допущения из methodology.md, а не нормативы.

rules:
  D1:
    predicate: missing_required
    severity: MEDIUM
    params: {escalate_after_days: 1, escalate_to: HIGH}
    title_template: "Нет обязательной техники: «{stage_name}»"
    message_template: >-
      Этап «{stage_name}» идёт по плану с {plan_start:date} по {plan_end:date}.
      На участке «{area_name}» {sessions_checked} рабочих сессий подряд нет ни одной
      единицы обязательной техники: {groups:groups}. Транзитная техника учитывается
      за последние {transient_window_sessions} сессии. Правило вехи, версия {stage_rule_version}.

  D2:
    predicate: incomplete_set
    severity: MEDIUM
    params: {escalate_after_days: 3, escalate_to: HIGH}
    title_template: "Неполный комплект техники: «{stage_name}»"
    message_template: >-
      Этап «{stage_name}» идёт по плану с {plan_start:date} по {plan_end:date}.
      На участке «{area_name}» {sessions_checked} рабочих сессий подряд: {observed:counts}.
      Не выполнено: {groups_failed:groups}. Транзитная техника учитывается за последние
      {transient_window_sessions} сессии. Правило вехи, версия {stage_rule_version}.

  # D3–D6: ключ — участок и класс техники; min_sessions — в params (T11).
  # D7–D10: предикаты и полный набор facts появляются в T12–T13; там же уточняются тексты.
  D3:
    predicate: unexpected_equipment
    severity: MEDIUM
    # Одиночный кадр отклонения не порождает (methodology.md, раздел 6).
    # variants.ahead — формулировка, когда класс нужен будущей вехе участка: ключом
    # отклонения тогда становится та веха.
    params:
      min_sessions: 2
      variants:
        ahead:
          title_template: "Возможное опережение: {equipment_name} для «{future_stage_name}»"
          message_template: >-
            На участке «{area_name}» {sessions_checked} рабочих сессий подряд:
            {equipment_name}, {count} ед. Этой техники нет в правилах активных вех участка
            ({active_stages:list}), но она нужна вехе «{future_stage_name}», которая по плану
            начинается {future_plan_start:date}.
    title_template: "Техника не по этапу: {equipment_name}"
    message_template: >-
      На участке «{area_name}» {sessions_checked} рабочих сессий подряд: {equipment_name},
      {count} ед. Этой техники нет в правилах активных вех участка: {active_stages:list}.

  D4:
    predicate: idle_equipment
    severity: LOW
    params: {min_sessions: 3, escalate_after_days: 1, escalate_to: MEDIUM}
    title_template: "Простой: {equipment_name}"
    message_template: >-
      {state_reason}. Так {sessions_checked} рабочих сессий подряд, единиц: {count}.

  D5:
    predicate: wrong_zone
    severity: MEDIUM
    params: {min_sessions: 2}
    title_template: "Техника не в той зоне: {equipment_name}"
    message_template: >-
      {state_reason}. Так {sessions_checked} рабочих сессий подряд, единиц: {count}.
      Активные по плану вехи: {active_stages:list}.

  D6:
    predicate: danger_zone
    severity: HIGH
    params: {min_sessions: 1}
    title_template: "Опасная зона: {equipment_name}"
    message_template: >-
      В опасной зоне «{area_name}» замечено: {equipment_name}, {count} ед. Рабочих
      сессий подряд: {sessions_checked}.

  D7:
    predicate: stage_mismatch
    severity: HIGH
    params: {min_sessions: 2}
    title_template: "Стадия по фото не совпадает с планом"
    message_template: >-
      {sessions_checked} рабочих сессий подряд стадия объекта по фото — {observed_stage}
      (уверенность {observed_conf}), по плану — {planned_stage}.

  D8:
    predicate: stage_overrun
    severity: HIGH
    params: {}
    title_template: "Этап затянулся: «{stage_name}»"
    message_template: >-
      Этап «{stage_name}» по плану закончился {plan_end:date}, но на участке «{area_name}»
      {sessions_checked} рабочих сессий подряд видна его техника: {observed:counts}.

  D9:
    predicate: late_start
    severity: HIGH
    params: {k_days: 3, min_visible_share: 0.5}
    title_template: "Этап не начат в срок: «{stage_name}»"
    message_template: >-
      Этап «{stage_name}» по плану начинается {plan_start:date}, но за {k_days} рабочих дня
      признак начала работ не появился на участке «{area_name}».

  D10:
    predicate: blind_area
    severity: INFO
    params: {min_sessions: 2}
    title_template: "Вне контроля ИИ: «{area_name}»"
    message_template: >-
      Участок «{area_name}» {sessions_checked} рабочих сессий подряд не виден ни одной
      камерой ({reason}). Выводы по нему не делаются — проверьте вручную.
