[project]
name = "vision-service"
version = "0.1.0"
description = "Сервис компьютерного зрения: детекция техники, стадия объекта, качество кадра"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
