# Общие правила линта и форматирования для всех Python-сервисов.
# Сервисы это НЕ переопределяют: нужно исключение — добавляется сюда с обоснованием.

# Версия ruff зафиксирована в requirements-dev.txt сервисов и в CI: набор правил
# меняется между версиями, а неизвестный селектор роняет разбор этого файла.
line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "BLE", "RUF"]
ignore = [
    "RUF001",  # кириллица в строках — у нас все сообщения пользователю по-русски
    "RUF002",
    "RUF003",
    # PEP 695-синтаксис дженериков (class Page[T]) в Pydantic-моделях ведёт себя
    # неодинаково между версиями, а цена ошибки — не запускающийся сервис.
    # Пользуемся классическим Generic[T].
    "UP046",
]

[lint.per-file-ignores]
"**/migrations/**" = ["E501"]
"**/tests/**" = ["E501"]

[format]
quote-style = "double"
