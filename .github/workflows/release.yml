# Публикация образов в GitHub Container Registry.
#
# Запускается вручную или по тегу, а не на каждый пуш: на хакатоне время
# конвейера дороже, чем свежесть образов. Нужен смысл — забрать собранные
# образы на демо-ноутбук командой docker compose pull, не собирая локально
# образ с CUDA на 6–8 ГБ.

name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:

  # Список сервисов не перечисляется руками: забытая строка здесь означала бы
  # не опубликованный образ при зелёном конвейере — ошибку, о которой никто
  # не узнает. Признак сервиса тот же, что в ci.yml: у него есть Dockerfile.
  discover:
    name: Найти сервисы
    runs-on: ubuntu-latest
    outputs:
      buildable: ${{ steps.list.outputs.buildable }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          buildable=$(for d in services/*/; do
            s=$(basename "$d")
            [ -f "$d/Dockerfile" ] && echo "$s"
          done | jq -R . | jq -sc .)
          echo "buildable=$buildable" >> "$GITHUB_OUTPUT"
          echo "публикуются: $buildable"

  publish:
    name: Публикация · ${{ matrix.service }}
    needs: discover
    if: needs.discover.outputs.buildable != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.discover.outputs.buildable) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
